<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="100" height="200"/>
    </clipPath>
  </defs>
  <!-- Main circle background (left half filled) -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#1a1a6e" stroke-width="0"/>
  <!-- Left half filled circle -->
  <path d="M100,15 A85,85 0 0,0 100,185 Z" fill="#1a1a6e"/>
  <!-- Right half arc (G shape) -->
  <path d="M100,15 A85,85 0 0,1 185,100 L185,100 A85,85 0 0,1 115,183" 
        fill="none" stroke="#1a1a6e" stroke-width="16" stroke-linecap="round"/>
  <!-- G horizontal bar -->
  <line x1="140" y1="100" x2="185" y2="100" stroke="#1a1a6e" stroke-width="16" stroke-linecap="round"/>
  <!-- Human figure (white on dark half) -->
  <!-- Head -->
  <circle cx="100" cy="55" r="10" fill="#1a1a6e" stroke="white" stroke-width="0"/>
  <circle cx="95" cy="55" r="8" fill="white"/>
  <circle cx="105" cy="55" r="8" fill="#1a1a6e"/>
  <!-- Body/arms - stylized human form -->
  <path d="M80,75 Q65,105 80,140 Q90,160 100,175 Q110,160 120,140 Q135,105 120,75 Q110,65 100,70 Q90,65 80,75Z" fill="none" stroke="white" stroke-width="0"/>
  <!-- Left wing/arm (white) -->
  <path d="M95,68 Q60,95 75,140 Q85,160 100,178" fill="white" stroke="none"/>
  <!-- Right wing/arm (dark blue, on white half) -->
  <path d="M105,68 Q140,95 125,140 Q115,160 100,178" fill="#1a1a6e" stroke="none"/>
</svg>
